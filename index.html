
<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OshiLiFE - ホーム</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&display=swap"
        rel="stylesheet">
</head>

<body>

<div class="app-page active">

    <!-- ヘッダー -->
    <header class="top-header">

        <div class="home-logo">
            <h1>OshiLiFE</h1>
        </div>

        <a href="templates/profile.html" class="home-profile-link">
            <img
                id="homeProfile"
                class="profile-icon"
                src="images/default-profile.png"
                alt="プロフィール">
        </a>

    </header>

    <!-- メイン -->
    <main class="main-content">

        <!-- カウントダウン -->
        <section class="cute-card">
            <div>
                <h3>✨ 次のイベント</h3>
                <p id="next-event-title">未定</p>
            </div>

            <div class="countdown">
                あと
                <span id="countdown-days">--</span>
                日
            </div>
        </section>

        <!-- 今日の予定 -->
        <div class="home-grid">

            <section class="cute-card">
                <h3>📅 今日の予定</h3>
                <div id="today-schedule-title">
                    予定はありません
                </div>
            </section>

            <section
                class="cute-card money-card"
                onclick="location.href='templates/money.html'">

                <h3>💰 今月の推し費</h3>
                <h2 id="home-total-money">¥0</h2>

            </section>

        </div>

        <!-- 推し一覧 -->
        <section class="cute-card">

            <div class="section-title">
                <span>🧸 推しメン図鑑</span>
                <a href="templates/profile.html">編集</a>
            </div>

            <div
                id="home-oshi-mini-list"
                class="oshi-list">
            </div>

        </section>

        <!-- 最近の思い出 -->
        <section class="cute-card">

            <div class="section-title">
                <span>📸 最近の思い出</span>
                <a href="templates/log.html">もっと見る</a>
            </div>

            <div id="home-latest-log">
                まだありません
            </div>

        </section>

    </main>

    <!-- 下部タブ -->
    <nav class="tab-bar">

        <a href="index.html" class="tab active">
            <i class="fa-solid fa-house"></i>
            <span>ホーム</span>
        </a>

        <a href="templates/schedule.html" class="tab">
            <i class="fa-solid fa-calendar-days"></i>
            <span>予定</span>
        </a>

        <a href="templates/log.html" class="tab">
            <i class="fa-solid fa-camera"></i>
            <span>ログ</span>
        </a>

        <a href="templates/goods.html" class="tab">
            <i class="fa-solid fa-bag-shopping"></i>
            <span>グッズ</span>
        </a>

        <a href="templates/money.html" class="tab">
            <i class="fa-solid fa-wallet"></i>
            <span>お金</span>
        </a>

        <a href="templates/profile.html" class="tab">
            <i class="fa-solid fa-user"></i>
            <span>プロフ</span>
        </a>

    </nav>

</div>

<script src="js/script.js"></script>

</body>
</html>
