
<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>OshiLog - 思い出ログ</title>

    <link rel="stylesheet"
          href="../css/style.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&display=swap"
          rel="stylesheet">

</head>

<body data-calendar-type="log">

<div class="app-page active">

    <header class="page-header">

        <button type="button"
                onclick="location.href='../index.html'">

            <i class="fa-solid fa-arrow-left"></i>

        </button>

        <h1>📸 思い出ログ</h1>

        <div></div>

    </header>

    <main class="main-content">

        <!-- カレンダー -->

        <div class="cute-card calendar-card">

            <div class="calendar-page-title">

                <h2>📸 思い出カレンダー</h2>

                <p>
                    日付をタップして思い出を確認・追加できます
                </p>

            </div>

            <div id="calendar"></div>

        </div>

        <!-- 直接登録 -->

        <div class="cute-card">

            <h2>🧸 思い出を直接追加</h2>

            <form id="form-log">

                <label for="log-oshi-id">
                    👑 推し
                </label>

                <select id="log-oshi-id">
                    <option value="">推しを選択</option>
                </select>

                <label for="log-image">
                    📷 写真
                </label>

                <input
                    type="file"
                    id="log-image"
                    accept="image/*">

                <label for="log-title">
                    🎤 イベント名
                </label>

                <input
                    type="text"
                    id="log-title"
                    placeholder="例：○○ライブ">

                <label for="log-date">
                    📅 日付
                </label>

                <input
                    type="date"
                    id="log-date">

                <label for="log-place">
                    📍 場所
                </label>

                <input
                    type="text"
                    id="log-place"
                    placeholder="例：東京スカイツリー">

                <label for="log-feeling">
                    😊 気分
                </label>

                <select id="log-feeling">

                    <option value="">気分を選択</option>

                    <option value="😍 最高！">
                        😍 最高！
                    </option>

                    <option value="😊 楽しかった">
                        😊 楽しかった
                    </option>

                    <option value="😌 幸せ">
                        😌 幸せ
                    </option>

                    <option value="🥲 尊かった">
                        🥲 尊かった
                    </option>

                </select>

                <label for="log-memo">
                    📝 思い出
                </label>

                <textarea
                    id="log-memo"
                    rows="4"
                    placeholder="どんな思い出だった？"></textarea>

                <button
                    type="button"
                    class="cute-btn"
                    onclick="saveLog()">

                    保存する

                </button>

            </form>

        </div>

    </main>

    <!-- 下部タブ -->

    <nav class="tab-bar">

        <a href="../index.html" class="tab">
            <i class="fa-solid fa-house"></i>
            <span>ホーム</span>
        </a>

        <a href="schedule.html" class="tab">
            <i class="fa-solid fa-calendar-days"></i>
            <span>予定</span>
        </a>

        <a href="log.html" class="tab active">
            <i class="fa-solid fa-camera"></i>
            <span>ログ</span>
        </a>

        <a href="goods.html" class="tab">
            <i class="fa-solid fa-bag-shopping"></i>
            <span>グッズ</span>
        </a>

        <a href="money.html" class="tab">
            <i class="fa-solid fa-wallet"></i>
            <span>お金</span>
        </a>

        <a href="profile.html" class="tab">
            <i class="fa-solid fa-user"></i>
            <span>プロフ</span>
        </a>

    </nav>

</div>

<script src="../js/script.js"></script>

</body>
</html>
