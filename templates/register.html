<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OshiLog - 新規登録</title>

    <!-- CSS -->
    <link rel="stylesheet" href="../css/style.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&display=swap"
        rel="stylesheet">
</head>

<body>

    <div class="login-page">

        <div class="login-card">

            <!-- ロゴ -->
            <h1 class="logo">
                 OshiLog
            </h1>

            <p class="sub-title">
                あなただけの推し活を始めよう✨
            </p>


            <!-- ユーザー名 -->
            <div class="form-group">
                <label for="register-name">
                    ユーザー名
                </label>

                <input
                    type="text"
                    id="register-name"
                    placeholder="ユーザー名"
                    autocomplete="name">
            </div>


            <!-- メールアドレス -->
            <div class="form-group">
                <label for="register-email">
                    メールアドレス
                </label>

                <input
                    type="email"
                    id="register-email"
                    placeholder="example@example.com"
                    autocomplete="email">
            </div>


            <!-- パスワード -->
            <div class="form-group">
                <label for="register-password">
                    パスワード
                </label>

                <input
                    type="password"
                    id="register-password"
                    placeholder="********"
                    autocomplete="new-password">
            </div>


            <!-- パスワード確認 -->
            <div class="form-group">
                <label for="register-password2">
                    パスワード（確認）
                </label>

                <input
                    type="password"
                    id="register-password2"
                    placeholder="********"
                    autocomplete="new-password">
            </div>


            <!-- 新規登録ボタン -->
            <button
                type="button"
                class="cute-btn"
                onclick="register()">

                <i class="fa-solid fa-user-plus"></i>
                新規登録

            </button>


            <!-- ログイン画面へ -->
            <p class="register-link">

                すでにアカウントをお持ちですか？

                <a href="login.html">
                    ログイン
                </a>

            </p>

        </div>

    </div>


    <!-- JavaScript -->
    <script src="../js/script.js"></script>

</body>

</html>
