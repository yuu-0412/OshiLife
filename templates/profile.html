<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>OshiLog - プロフィール</title>

    <link rel="stylesheet"
          href="../css/style.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&display=swap"
          rel="stylesheet">

</head>


<body>


<div class="app-page active">


<header class="page-header">

    <button
        type="button"
        onclick="location.href='home.html'">

        <i class="fa-solid fa-arrow-left"></i>

    </button>


    <h1>

         プロフィール

    </h1>


    <div></div>

</header>



<main class="main-content">


    <!-- ============================= -->
    <!-- プロフィール設定 -->
    <!-- ============================= -->

    <div class="cute-card">


        <h2>

            👤 プロフィール設定

        </h2>


        <!-- プロフィール画像 -->

        <div class="profile-image-area">


            <img
                id="preview"
                src="../images/default-profile.png"
                class="profile-preview"
                alt="プロフィール画像">


            <label
                class="cute-btn"
                for="profile-image">

                📷 画像を選択

            </label>


            <input
                type="file"
                id="profile-image"
                accept="image/*"
                style="display:none;">


        </div>



        <!-- ニックネーム -->

        <label for="profile-name">

            ニックネーム

        </label>


        <input
            type="text"
            id="profile-name"
            placeholder="名前を入力">


        </label>


       



        

        <!-- 保存 -->

        <button
            class="cute-btn"
            type="button"
            id="save-profile">

            💾 プロフィールを保存

        </button>


    </div>




    <!-- ============================= -->
    <!-- 背景設定 -->
    <!-- ============================= -->

    <div class="cute-card">


        <h2>

            🎨 背景設定

        </h2>


        <!-- 背景画像 -->

        <label>

            背景画像

        </label>


        <div class="background-image-area">


            <img
                id="background-preview"
                class="background-preview"
                alt="背景画像プレビュー"
                style="display:none;">


            <label
                class="cute-btn"
                for="background-image">

                🖼️ 背景画像を選択

            </label>


            <input
                type="file"
                id="background-image"
                accept="image/*"
                style="display:none;">


        </div>



        <!-- 背景画像を使用する -->

        <label class="checkbox-label">


            <input
                type="checkbox"
                id="background-image-enabled">


            背景画像を表示する


        </label>



        <!-- 保存 -->

        <button
            class="cute-btn"
            type="button"
            id="save-background">

            💾 背景設定を保存

        </button>



        <!-- リセット -->

        <button
            class="cute-btn"
            type="button"
            id="reset-background">

            🔄 背景をリセット

        </button>


    </div>




    <!-- ============================= -->
    <!-- 推し一覧 -->
    <!-- ============================= -->

    <div class="cute-card">


        <h2>

            🧸 推し一覧

        </h2>


        <div id="oshi-list">

        </div>


        <button
            class="cute-btn"
            type="button"
            id="add-oshi">

            ＋ 推しを追加

        </button>


    </div>


</main>




<!-- ============================= -->
<!-- 下部タブ -->
<!-- ============================= -->

<nav class="tab-bar">


    <a
        href="home.html"
        class="tab">

        <i class="fa-solid fa-house"></i>

        <span>

            ホーム

        </span>

    </a>



    <a
        href="schedule.html"
        class="tab">

        <i class="fa-solid fa-calendar-days"></i>

        <span>

            予定

        </span>

    </a>



    <a
        href="log.html"
        class="tab">

        <i class="fa-solid fa-camera"></i>

        <span>

            ログ

        </span>

    </a>



    <a
        href="goods.html"
        class="tab">

        <i class="fa-solid fa-bag-shopping"></i>

        <span>

            グッズ

        </span>

    </a>



    <a
        href="money.html"
        class="tab">

        <i class="fa-solid fa-wallet"></i>

        <span>

            お金

        </span>

    </a>



    <a
        href="profile.html"
        class="tab active">

        <i class="fa-solid fa-user"></i>

        <span>

            プロフ

        </span>

    </a>


</nav>


</div>



<!-- ============================= -->
<!-- JavaScript -->
<!-- ============================= -->

<script src="../js/script.js"></script>


</body>

</html>
