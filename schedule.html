<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>OshiLog - 予定</title>

    <link rel="stylesheet"
          href="../css/style.css">
    
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&display=swap"
          rel="stylesheet">
</head>

<body data-calendar-type="schedule">

<div class="app-page active">

    <header class="page-header">

        <button type="button"
                onclick="location.href='home.html'">
            <i class="fa-solid fa-arrow-left"></i>
        </button>

        <h1>📅 予定</h1>

        <div></div>

    </header>

    <main class="main-content">

        <!-- =========================
             カレンダー
        ========================== -->

        <div class="cute-card calendar-card">

            <div class="calendar-page-title">
                <h2>📅 スケジュール</h2>
                <p>日付をタップして予定を確認・追加できます</p>
            </div>

            <div id="calendar"></div>

        </div>


        <!-- =========================
             直接登録
        ========================== -->

        <div class="cute-card">

            <h2>➕ 予定を登録</h2>

            <form id="form-schedule">

                <label for="sch-oshi-id">
                    👑 推し
                </label>

                <select id="sch-oshi-id">
                    <option value="">推しを選択</option>
                </select>


                <label for="sch-title">
                    🎈 タイトル
                </label>

                <input
                    type="text"
                    id="sch-title"
                    placeholder="例：ライブ">


                <label for="sch-date">
                    📅 日付
                </label>

                <input
                    type="date"
                    id="sch-date">


                <label for="sch-time">
                    ⏰ 時間
                </label>

                <input
                    type="time"
                    id="sch-time">


                <label for="sch-place">
                    📍 場所
                </label>

                <input
                    type="text"
                    id="sch-place"
                    placeholder="例：東京ドーム">


                <label for="sch-memo">
                    📝 メモ
                </label>

                <textarea
                    id="sch-memo"
                    rows="3"
                    placeholder="メモを入力"></textarea>


                <button
                    type="button"
                    class="cute-btn"
                    onclick="addScheduleManual()">

                    登録する

                </button>

            </form>

        </div>

    </main>


    <!-- =========================
         下部タブ
    ========================== -->

    <nav class="tab-bar">

        <a href="home.html" class="tab">
            <i class="fa-solid fa-house"></i>
            <span>ホーム</span>
        </a>

        <a href="schedule.html" class="tab active">
            <i class="fa-solid fa-calendar-days"></i>
            <span>予定</span>
        </a>

        <a href="log.html" class="tab">
            <i class="fa-solid fa-camera"></i>
            <span>ログ</span>
        </a>

        <a href="goods.html" class="tab">
            <i class="fa-solid fa-bag-shopping"></i>
            <span>グッズ</span>
        </a>

        <a href="money.html" class="tab">
            <i class="fa-solid fa-wallet"></i>
            <span>お金</span>
        </a>

        <a href="profile.html" class="tab">
            <i class="fa-solid fa-user"></i>
            <span>プロフ</span>
        </a>

    </nav>

</div>

<script src="../js/script.js"></script>

</body>
</html>
